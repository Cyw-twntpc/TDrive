<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="icon.ico">
    <title data-i18n="main.window_title"></title>
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css?v=6">
    <link rel="stylesheet" href="vendor/highlightjs/github.min.css?v=11.11.1">
    <link rel="stylesheet" href="css/style.css?v=8">
    <link rel="stylesheet" href="css/themes/_dark.css?v=1">
    <script src="vendor/highlightjs/highlight.min.js?v=11.11.1"></script>
    <script type="text/javascript" src="js/qwebchannel.js?v=6"></script>
    <script type="text/javascript">
        window.addEventListener('load', function() {
            if (typeof qt !== 'undefined') {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    window.tdrive_bridge = channel.objects.tdrive_bridge;
                    console.log("QWebChannel bridge initialized.");
                    document.dispatchEvent(new Event("TDriveBridgeReady"));
                });
            } else {
                console.warn("QWebChannel object 'qt' not found. Running in UI testing mode.");
                document.dispatchEvent(new Event("TDriveBridgeReady"));
            }
        });
    </script>
</head>
<body oncontextmenu="return false;">
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo unselectable">
                <img src="title.png" alt="TDrive Logo">
            </div>
            
            <div class="sidebar-body">
                <!-- Nav Rail -->
                <nav id="nav-rail" class="nav-rail">
                    <ul class="nav-items">
                        <li class="nav-item active" data-page="files">
                            <i class="fas fa-folder"></i>
                            <span class="nav-text" data-i18n="main.nav_files"></span>
                        </li>
                        <li class="nav-item" data-page="transfer">
                            <i class="fas fa-exchange-alt"></i>
                            <span class="nav-text" data-i18n="main.nav_transfer"></span>
                        </li>
                        <li class="nav-item disabled" data-page="shared" data-i18n-tooltip="main.coming_soon" data-tooltip-pos="right">
                            <i class="fas fa-share-alt"></i>
                            <span class="nav-text" data-i18n="main.nav_shared"></span>
                        </li>
                        <li class="nav-item" data-page="trash">
                            <i class="fas fa-trash-alt"></i>
                            <span class="nav-text" data-i18n="main.nav_trash"></span>
                        </li>
                    </ul>
                </nav>

                <!-- Sidebar Content -->
                <div class="sidebar-content">
                    <div class="sidebar-actions">
                        <button id="sidebar-new-btn" class="btn-primary-block" data-popover="new-menu-popover">
                            <i class="fas fa-plus"></i> <span data-i18n="main.btn_new"></span>
                        </button>
                        <div id="new-menu-popover" class="popover hidden unselectable">
                            <ul style="list-style: none; padding: 0;">
                                <li id="new-upload-file-btn" class="popover-item">
                                    <i class="fas fa-file-upload"></i> <span data-i18n="main.new_upload_file"></span>
                                </li>
                                <li id="new-upload-folder-btn" class="popover-item">
                                    <i class="fas fa-folder-plus"></i> <span data-i18n="main.new_upload_folder"></span>
                                </li>
                                <li id="new-create-folder-btn" class="popover-item">
                                    <i class="fas fa-plus"></i> <span data-i18n="main.new_create_folder"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    
                    <nav class="file-tree-nav">
                        <ul id="file-tree"></ul>
                    </nav>
                    
                    <div id="sidebar-transfer-status" class="sidebar-transfer-status">
                        <div class="sidebar-transfer-left">
                             <div class="transfer-icon-wrapper"></div>
                        </div>
                        <div class="sidebar-transfer-right">
                            <div class="transfer-info-row">
                                <span id="sidebar-transfer-title"></span>
                            </div>
                            <div class="transfer-info-row">
                                <span id="sidebar-transfer-speed">-- B/s</span>
                            </div>
                            <div class="sidebar-progress-container">
                                <div id="sidebar-transfer-bar" class="sidebar-progress-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div id="global-progress-bar"><div class="runner"></div></div>
            
            <!-- Files Page -->
            <div id="page-files" class="page-view active">
                <header class="top-bar">
                    <div class="top-row">
                        <div class="search-container">
                            <div class="search-bar">
                                <i class="fas fa-search"></i>
                                <input type="text" data-i18n-placeholder="main.search_placeholder" spellcheck="false" autocomplete="off">
                            </div>
                            <button id="search-scope-toggle" class="search-scope-btn" data-i18n-tooltip="main.search_scope_title"><span data-i18n="main.search_scope_all"></span></button>
                        </div>
                        <div class="user-actions">
                            <button id="view-toggle-btn" class="btn-icon" data-i18n-tooltip="main.view_toggle_title"><i class="fas fa-th-large"></i></button>
                            <button id="help-btn" class="btn-icon" data-popover="help-popover"><i class="fas fa-question-circle"></i></button>
                            <button id="settings-btn" class="btn-icon" data-popover="settings-popover"><i class="fas fa-cog"></i></button>
                            <button id="user-btn" class="btn-icon" data-popover="user-popover">
                                <i class="fas fa-user-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="bottom-row">
                        <nav id="breadcrumb" class="breadcrumb-nav"></nav>
                    </div>
                </header>

                <section id="file-list-container" class="file-list-section">
                    <div class="data-list-header file-list-header">
                        <div class="col file-item-col name sortable" data-sort="name">
                            <div class="header-name-wrapper">
                                <span data-i18n="file_list.col_name"></span>
                                <span class="sort-icon"></span>
                            </div>
                        </div>
                        <div class="col file-item-col date sortable" data-sort="date">
                            <div class="header-name-wrapper">
                                <span data-i18n="file_list.col_date"></span>
                                <span class="sort-icon"></span>
                            </div>
                        </div>
                        <div class="col file-item-col type sortable" data-sort="type">
                            <div class="header-name-wrapper">
                                <span data-i18n="file_list.col_type"></span>
                                <span class="sort-icon"></span>
                            </div>
                        </div>
                        <div class="col file-item-col size sortable" data-sort="size">
                            <div class="header-name-wrapper">
                                <span data-i18n="file_list.col_size"></span>
                                <span class="sort-icon"></span>
                            </div>
                        </div>
                    </div>
                    <div id="file-list-body" class="file-list-body">
                    </div>
                    <div id="selection-box" class="selection-box"></div>
                </section>
                
                <!-- Floating Action Toolbar -->
                <div id="file-floating-toolbar" class="floating-toolbar">
                    <button class="toolbar-btn" id="ft-download-btn" data-i18n-tooltip="menu.download"><i class="fas fa-download"></i></button>
                    <button class="toolbar-btn" id="ft-move-btn" data-i18n-tooltip="menu.move"><i class="fas fa-arrow-right-to-bracket"></i></button>
                    <button class="toolbar-btn" id="ft-rename-btn" data-i18n-tooltip="menu.rename"><i class="fas fa-pencil-alt"></i></button>
                    <div class="toolbar-separator"></div>
                    <button class="toolbar-btn hidden" id="ft-add-playlist-btn" data-i18n-tooltip="music.add_to_playlist"><i class="fas fa-list-ul"></i></button>
                    <button class="toolbar-btn" id="ft-share-btn" data-i18n-tooltip="menu.share_soon"><i class="fas fa-share-alt"></i></button>
                    <button class="toolbar-btn" id="ft-details-btn" data-i18n-tooltip="menu.details"><i class="fas fa-info-circle"></i></button>
                    <div class="toolbar-separator"></div>
                    <button class="toolbar-btn" id="ft-trash-btn" data-i18n-tooltip="menu.move_to_trash"><i class="fas fa-trash"></i></button>
                </div>
            </div>

            <!-- Trash Page -->
            <div id="page-trash" class="page-view hidden">
                <header class="top-bar">
                    <div class="top-row">
                        <div class="trash-header-title">
                            <i class="fas fa-trash-alt"></i> <span data-i18n="main.nav_trash"></span> <span class="trash-tip" data-i18n="trash.tip"></span>
                        </div>
                    </div>
                    <div class="bottom-row">
                        <div id="trash-bulk-actions" class="action-buttons hidden">
                            <button id="trash-restore-btn" class="btn"><i class="fas fa-undo-alt"></i> <span data-i18n="trash.btn_restore"></span></button>
                            <button id="trash-delete-btn" class="btn btn-danger"><i class="fas fa-trash-alt"></i> <span data-i18n="trash.btn_delete"></span></button>
                        </div>
                        <div class="action-buttons">
                            <button id="empty-trash-btn" class="btn">
                                <i class="fas fa-dumpster"></i> <span data-i18n="trash.btn_empty"></span>
                            </button>
                        </div>
                    </div>
                </header>
                <section class="file-list-section">
                    <div class="data-list-header trash-list-header trash-header">
                        <div class="sortable" data-sort="name">
                            <div class="header-name-wrapper"><span data-i18n="file_list.col_name"></span><span class="sort-icon"></span></div>
                        </div>
                        <div class="sortable desc" data-sort="trashed_date">
                            <div class="header-name-wrapper"><span data-i18n="trash.col_deleted_date"></span><span class="sort-icon"></span></div>
                        </div>
                        <div class="sortable" data-sort="type">
                            <div class="header-name-wrapper"><span data-i18n="file_list.col_type"></span><span class="sort-icon"></span></div>
                        </div>
                        <div class="sortable" data-sort="original_parent_id">
                            <div class="header-name-wrapper"><span data-i18n="trash.col_original_path"></span><span class="sort-icon"></span></div>
                        </div>
                        <div class="sortable" data-sort="size">
                            <div class="header-name-wrapper"><span data-i18n="file_list.col_size"></span><span class="sort-icon"></span></div>
                        </div>
                    </div>
                    <div id="trash-list-body" class="trash-list-body">
                        <!-- Trash items -->
                    </div>
                    <div id="trash-selection-box" class="selection-box"></div>
                </section>
            </div>

            <!-- Transfer Dashboard -->
            <div id="page-transfer" class="page-view hidden">
                <div class="transfer-dashboard-body">
                    
                    <!-- Hero Section -->
                    <div class="hero-section">

                        <div class="hero-content">
                            <div class="hero-stat-block">
                                <h2 id="hero-total-speed">-- B/s</h2>
                                <p data-i18n="transfer.total_speed"></p>
                            </div>
                            <div class="hero-stat-block">
                                <h2 id="hero-daily-traffic">--</h2>
                                <p data-i18n="transfer.daily_traffic"></p>
                            </div>
                            <div class="hero-stat-block">
                                <h2 id="hero-eta">--:--:--</h2>
                                <p data-i18n="transfer.eta"></p>
                            </div>
                        </div>
                        <div class="hero-actions">
                            <button id="global-resume-btn" class="icon-btn-lg" data-i18n-tooltip="transfer.resume_all"><i class="fas fa-play"></i></button>
                            <button id="global-pause-btn" class="icon-btn-lg" data-i18n-tooltip="transfer.pause_all"><i class="fas fa-pause"></i></button>
                            <button id="global-cancel-btn" class="icon-btn-lg danger" data-i18n-tooltip="transfer.cancel_all"><i class="fas fa-times"></i></button>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="tabs-container">
                        <div class="tab-item active" data-tab="uploads" data-i18n="transfer.tab_uploads"></div>
                        <div class="tab-item" data-tab="downloads" data-i18n="transfer.tab_downloads"></div>
                        <div class="tab-item" data-tab="completed" data-i18n="transfer.tab_completed"></div>
                    </div>

                    <!-- Dynamic Content -->
                    <div id="transfer-live-view">
                        <!-- Active Tasks -->
                        <div id="section-active" class="task-section">
                            <div class="task-group-title" style="color:var(--primary);">
                                <span data-i18n="transfer.section_active"></span> (<span id="count-active">0</span>) <div class="group-line"></div>
                            </div>
                            <div id="list-active" class="task-list-container"></div>
                        </div>

                        <!-- Failed Tasks -->
                        <div id="section-failed" class="task-section hidden">
                            <div class="task-group-title" style="color:var(--danger);">
                                <span data-i18n="transfer.section_failed"></span> (<span id="count-failed">0</span>) 
                                <div class="group-line"></div> 
                                <button id="retry-all-btn" class="retry-all-btn" data-i18n="transfer.btn_retry_all"></button>
                            </div>
                            <div id="list-failed" class="task-list-container"></div>
                        </div>

                        <!-- Queued Tasks -->
                        <div id="section-queued" class="task-section">
                            <div class="task-group-title">
                                <span data-i18n="transfer.section_queued"></span> (<span id="count-queued">0</span>) <div class="group-line"></div>
                            </div>
                            <div id="list-queued" class="task-list-container"></div>
                        </div>
                    </div>

                    <!-- Completed View -->
                    <div id="transfer-completed-view" class="hidden">
                        <div class="completed-filter-bar">
                            <div class="filters-group">
                                <div class="filter-segment active" data-filter="all" data-i18n="transfer.filter_all"></div>
                                <div class="filter-segment" data-filter="upload" data-i18n="transfer.filter_upload"></div>
                                <div class="filter-segment" data-filter="download" data-i18n="transfer.filter_download"></div>
                            </div>
                            <button id="btn-clear-completed" class="btn-text-danger"><i class="fas fa-trash-alt"></i> <span data-i18n="transfer.btn_clear_history"></span></button>
                        </div>
                        <div class="sort-bar">
                            <span class="sort-label" data-i18n="transfer.sort_by"></span>
                            <div class="sort-item active" data-sort="time"><span data-i18n="transfer.sort_time"></span> <i class="fas fa-sort-down"></i></div>
                            <div class="sort-item" data-sort="name" data-i18n="file_list.col_name"></div>
                        </div>
                        <div id="list-completed" class="history-list"></div>
                    </div>

                </div>
            </div>

        </main>
    </div>
    
    <div id="help-popover" class="popover hidden unselectable">
        <h3 data-i18n="dialog.help_title"></h3>
        <p data-i18n="dialog.help_intro"></p>
        <p><b data-i18n="dialog.help_tips"></b></p>
        <ul>
            <li data-i18n="dialog.help_tip_1"></li>
            <li data-i18n="dialog.help_tip_2"></li>
            <li data-i18n="dialog.help_tip_3"></li>
            <li data-i18n="dialog.help_tip_4"></li>
        </ul>
    </div>

    <div id="settings-popover" class="popover hidden unselectable">
        <h3 data-i18n="dialog.settings_title"></h3>
        <div class="setting-item">
            <label for="language-select" data-i18n="dialog.settings_language"></label>
            <select id="language-select">
                <option value="zh-TW">繁體中文</option>
                <option value="en-US">English</option>
            </select>
        </div>
        <div class="setting-item">
            <label for="theme-select" data-i18n="dialog.settings_theme"></label>
            <select id="theme-select">
                <option value="light" data-i18n="dialog.theme_light"></option>
                <option value="dark" data-i18n="dialog.theme_dark"></option>
            </select>
        </div>
        <div class="setting-item">
            <label for="concurrency-select" data-i18n="dialog.settings_concurrency"></label>
            <select id="concurrency-select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        <div class="setting-item">
            <label data-i18n="dialog.settings_default_dl"></label>
            <div class="setting-control-group">
                <label class="switch">
                    <input type="checkbox" id="use-default-download-path-toggle">
                    <span class="slider round"></span>
                </label>
                <button id="set-default-download-path-btn" class="btn btn-secondary" style="font-size: 12px; padding: 4px 8px;" data-i18n="dialog.btn_select_path"></button>
            </div>
        </div>
        <div id="default-download-path-display" class="setting-path-display"><span data-i18n="dialog.path_not_set"></span></div>
        <button id="save-settings-btn" class="btn" style="margin-top: 20px; width: 100%;" data-i18n="dialog.btn_save_settings"></button>
        <button id="restore-settings-btn" class="btn btn-danger" style="margin-top: 10px; width: 100%;" data-i18n="dialog.btn_restore_settings">恢復預設值</button>
    </div>

    <div id="user-popover" class="popover hidden unselectable">
        <h3 data-i18n="dialog.user_info_title"></h3>
        <div id="user-info-content"></div>
        <button id="logout-btn" class="btn btn-danger" style="margin-top: 20px; width: 100%;" data-i18n="dialog.btn_logout"></button>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden unselectable">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h2 id="confirm-title" data-i18n="dialog.confirm_title"></h2>
                <button id="confirm-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="confirm-message" data-i18n="dialog.confirm_msg"></p>
            </div>
            <div class="modal-footer">
                <button id="confirm-cancel-btn" class="btn btn-secondary" data-i18n="dialog.btn_cancel"></button>
                <button id="confirm-ok-btn" class="btn btn-danger" data-i18n="dialog.btn_ok"></button>
            </div>
        </div>
    </div>

    <div id="move-modal" class="modal-overlay hidden unselectable">
        <div class="modal-content medium-modal">
            <div class="modal-header">
                <h2 data-i18n="dialog.move_title"></h2>
                <button id="move-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p data-i18n="dialog.move_msg"></p>
                <div id="move-tree-container" class="folder-tree-container">
                    <!-- Folder tree will be injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="move-cancel-btn" class="btn btn-secondary" data-i18n="dialog.btn_cancel"></button>
                <button id="move-confirm-btn" class="btn" data-i18n="dialog.btn_move_here"></button>
            </div>
        </div>
    </div>

    <div id="alert-modal" class="modal-overlay hidden unselectable">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h2 id="alert-title" data-i18n="dialog.alert_title"></h2>
                <button id="alert-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="alert-message"></p>
            </div>
            <div class="modal-footer">
                <button id="alert-ok-btn" class="btn" data-i18n="dialog.btn_ok"></button>
            </div>
        </div>
    </div>

    <div id="prompt-modal" class="modal-overlay hidden">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h2 id="prompt-title" data-i18n="dialog.prompt_title"></h2>
                <button id="prompt-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="prompt-message" data-i18n="dialog.prompt_msg"></p>
                <input type="text" id="prompt-input" class="modal-input" spellcheck="false" autocomplete="off">
                <p id="prompt-error" class="modal-error hidden"></p>
            </div>
            <div class="modal-footer">
                <button id="prompt-cancel-btn" class="btn btn-secondary" data-i18n="dialog.btn_cancel"></button>
                <button id="prompt-ok-btn" class="btn" data-i18n="dialog.btn_ok"></button>
            </div>
        </div>
    </div>
    
    <!-- Text Preview Modal -->
    <div id="text-modal" class="modal-overlay hidden">
        <div class="modal-content large-modal">
            <div class="modal-header">
                <h2 id="text-filename"></h2>
                <button id="text-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div id="text-empty-state" class="preview-state">
                    <i class="fas fa-file-alt" style="font-size:48px"></i>
                    <p data-i18n="preview.select_file"></p>
                </div>
                <div id="text-loading-state" class="preview-state hidden">
                    <div class="spinner"></div>
                    <p data-i18n="preview.loading"></p>
                </div>
                <div id="text-render-state" class="preview-state hidden">
                    <pre><code id="text-code-block" class="hljs"></code></pre>
                </div>
                <div id="text-error-state" class="preview-state hidden">
                    <i class="fas fa-exclamation-triangle" style="font-size:48px"></i>
                    <p id="text-error-msg"></p>
                    <button id="text-retry-btn" class="btn" data-i18n="preview.btn_retry"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Document Preview Modal -->
    <div id="document-modal" class="modal-overlay hidden">
        <div class="modal-content large-modal">
            <div class="modal-header">
                <h2 id="doc-filename"></h2>
                <button id="doc-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div id="doc-empty-state" class="preview-state">
                    <i class="fas fa-file-pdf" style="font-size:48px"></i>
                    <p data-i18n="preview.select_file"></p>
                </div>
                <div id="doc-loading-state" class="preview-state hidden">
                    <div class="spinner"></div>
                    <p data-i18n="preview.loading"></p>
                </div>
                <div id="doc-render-state" class="preview-state hidden">
                    <iframe id="doc-embed" width="100%" height="100%" style="border:none;"></iframe>
                    <div id="doc-footer-bar" class="doc-footer hidden">
                        <span data-i18n="preview.doc_first_10_pages"></span>
                        <button id="doc-load-full-btn" class="btn btn-primary" data-i18n="preview.doc_load_full"></button>
                    </div>
                </div>
                <div id="doc-error-state" class="preview-state hidden">
                    <i class="fas fa-exclamation-triangle" style="font-size:48px"></i>
                    <p id="doc-error-msg"></p>
                    <button id="doc-retry-btn" class="btn" data-i18n="preview.btn_retry"></button>
                </div>
            </div>
        </div>
    </div>

    <div id="gallery-modal" class="gallery-overlay hidden">
        <div class="gallery-header">
            <span id="gallery-filename"></span>
            <button id="gallery-close-btn" class="icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="gallery-content">
            <button id="gallery-prev-btn" class="nav-btn left"><i class="fas fa-chevron-left"></i></button>
            <div class="gallery-image-wrapper">
                <img id="gallery-image" src="" alt="Preview">
                <div id="gallery-spinner" class="spinner hidden"></div>
            </div>
            <button id="gallery-next-btn" class="nav-btn right"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div id="gallery-filmstrip" class="gallery-filmstrip">
            <!-- Thumbnails injected by JS -->
        </div>
    </div>

    <div id="blocking-overlay" class="modal-overlay hidden" style="z-index: 9998; background-color: rgba(90, 90, 90, 0.2);">
        <!-- This is a generic, content-less overlay to block UI interactions -->
    </div>

    <div id="connection-lost-overlay" class="modal-overlay hidden" style="z-index: 10000; background-color: rgba(0, 0, 0, 0.6);">
        <div class="loading-content" style="color: white; text-align: center;">
            <i class="fas fa-wifi-slash" style="font-size: 48px; margin-bottom: 20px;"></i>
            <p style="font-size: 20px; font-weight: 500;"><span data-i18n="main.conn_lost"></span></p>
            <p style="font-size: 16px; color: #ccc; margin-top: 8px;"><span data-i18n="main.conn_reconnecting"></span></p>
        </div>
    </div>

    <div id="interaction-lock-overlay"></div>

    <!-- 3-Stage Progressive Audio Studio (Mini -> Bar -> Window) -->
    <div id="audio-studio-backdrop" class="audio-studio-backdrop hidden"></div>
    <section id="audio-studio" class="audio-studio unselectable" data-mode="mini" aria-label="Audio Studio">
        <!-- Stage 1: Mini Floating Indicator Pill -->
        <div class="audio-mini-pill" id="audio-mini-pill">
            <div class="audio-mini-trigger" id="audio-mini-expand-bar-btn">
                <div class="audio-eq-bars" id="audio-mini-eq">
                    <span></span><span></span><span></span>
                </div>
                <i class="fas fa-music audio-idle-icon"></i>
                <span id="audio-mini-title" class="audio-mini-title" data-i18n="music.library_title" data-tooltip-truncated="true"></span>
            </div>
            <div class="audio-mini-actions">
                <button id="audio-mini-play-btn" class="audio-icon-btn sm"><i class="fas fa-play"></i></button>
                <button id="audio-mini-expand-window-btn" class="audio-icon-btn sm" data-i18n-tooltip="music.open_studio"><i class="fas fa-expand-alt"></i></button>
            </div>
        </div>

        <!-- Stage 3: Expanded Music & Playlist Management Studio -->
        <div class="audio-studio-window-body" id="audio-studio-window-body">
            <div class="audio-studio-header">
                <div class="audio-studio-title-group">
                    <i class="fas fa-compact-disc audio-studio-logo-icon"></i>
                    <h2 data-i18n="music.studio_title"></h2>
                </div>
                <div class="audio-studio-search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="audio-studio-search-input" data-i18n-placeholder="music.search_placeholder" spellcheck="false" autocomplete="off">
                </div>
                <div class="audio-studio-window-actions">
                    <button id="audio-window-to-bar-btn" class="audio-icon-btn" data-i18n-tooltip="music.collapse_to_bar"><i class="fas fa-chevron-down"></i></button>
                    <button id="audio-window-to-mini-btn" class="audio-icon-btn" data-i18n-tooltip="music.minimize"><i class="fas fa-minus"></i></button>
                </div>
            </div>

            <div class="audio-studio-workspace">
                <aside class="audio-studio-sidebar">
                    <div class="audio-sidebar-section">
                        <div class="audio-sidebar-label" data-i18n="music.section_library"></div>
                        <button class="audio-sidebar-item active" id="audio-nav-all" data-view="all">
                            <span class="audio-sidebar-item-left"><i class="fas fa-music"></i> <span data-i18n="music.all_music"></span></span>
                            <span class="audio-count-badge" id="audio-count-all">0</span>
                        </button>
                        <button class="audio-sidebar-item" id="audio-nav-folders" data-view="folders">
                            <span class="audio-sidebar-item-left"><i class="fas fa-folder-open"></i> <span data-i18n="music.by_folder"></span></span>
                            <span class="audio-count-badge" id="audio-count-folders">0</span>
                        </button>
                    </div>

                    <div class="audio-sidebar-section playlists-section">
                        <div class="audio-sidebar-label-row">
                            <span class="audio-sidebar-label" data-i18n="music.section_playlists"></span>
                            <button id="audio-new-playlist-btn" class="audio-sidebar-add-btn" data-i18n-tooltip="music.new_playlist">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                        <ul id="audio-playlist-sidebar-list" class="audio-playlist-sidebar-list"></ul>
                    </div>
                </aside>

                <div class="audio-studio-main">
                    <div class="audio-view-toolbar">
                        <div class="audio-view-heading">
                            <h3 id="audio-view-title"></h3>
                            <span id="audio-view-count" class="audio-view-count"></span>
                            <div id="audio-playlist-manage-btns" class="audio-playlist-manage-btns hidden">
                                <button id="audio-playlist-rename-btn" class="audio-btn-ghost sm" data-i18n-tooltip="music.rename_playlist"><i class="fas fa-pencil-alt"></i></button>
                                <button id="audio-playlist-delete-btn" class="audio-btn-ghost sm danger" data-i18n-tooltip="music.delete_playlist"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                        <div class="audio-view-actions">
                            <button id="audio-play-all-btn" class="btn audio-action-primary"><i class="fas fa-play"></i> <span data-i18n="music.play_all"></span></button>
                            <button id="audio-shuffle-all-btn" class="btn btn-secondary audio-action-secondary"><i class="fas fa-random"></i> <span data-i18n="music.shuffle_play"></span></button>
                        </div>
                    </div>

                    <div class="audio-track-table-header">
                        <span class="col-idx">#</span>
                        <span class="col-name audio-sortable-col asc" data-sort="name"><span data-i18n="music.col_track"></span><span class="sort-icon"></span></span>
                        <span class="col-folder audio-sortable-col" data-sort="folder"><span data-i18n="music.col_folder"></span><span class="sort-icon"></span></span>
                        <span class="col-ext audio-sortable-col" data-sort="format"><span data-i18n="music.col_format"></span><span class="sort-icon"></span></span>
                        <span class="col-actions" data-i18n="music.col_actions"></span>
                    </div>
                    <div id="audio-studio-track-list" class="audio-studio-track-list"></div>
                </div>
            </div>
        </div>

        <!-- Stage 2: Active Queue Drawer inside Bar Mode -->
        <div class="audio-bar-queue-panel" id="audio-bar-queue-panel">
            <div class="audio-bar-queue-header" id="audio-bar-queue-header">
                <span class="audio-bar-queue-title"><i class="fas fa-stream"></i> <span data-i18n="music.now_playing_queue"></span></span>
                <div class="audio-bar-queue-header-right">
                    <span id="audio-bar-queue-count" class="audio-count-badge">0</span>
                    <button id="audio-bar-queue-toggle-btn" class="audio-icon-btn sm" data-i18n-tooltip="music.toggle_queue">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
            </div>
            <div id="audio-bar-queue-list" class="audio-bar-queue-list"></div>
        </div>

        <!-- Stage 2 & Shared Bottom Transport Bar -->
        <div class="audio-transport-bar" id="audio-transport-bar">
            <div class="audio-bar-track-info">
                <div class="audio-bar-art">
                    <div class="audio-eq-bars" id="audio-bar-eq">
                        <span></span><span></span><span></span>
                    </div>
                    <i class="fas fa-music audio-bar-idle-icon"></i>
                </div>
                <div class="audio-bar-meta">
                    <div id="audio-bar-title" class="audio-bar-title" data-i18n="music.no_track_playing" data-tooltip-truncated="true"></div>
                    <div id="audio-bar-subtitle" class="audio-bar-subtitle"></div>
                </div>
            </div>

            <div class="audio-bar-center">
                <div class="audio-transport-buttons">
                    <button id="audio-prev-btn" class="audio-icon-btn"><i class="fas fa-step-backward"></i></button>
                    <button id="audio-play-pause-btn" class="audio-play-btn"><i class="fas fa-play"></i></button>
                    <button id="audio-next-btn" class="audio-icon-btn"><i class="fas fa-step-forward"></i></button>
                </div>
                <div class="audio-progress-row">
                    <span id="audio-time-current" class="audio-time-label">00:00</span>
                    <input type="range" id="audio-seek-slider" class="audio-seek-slider" min="0" max="1000" value="0">
                    <span id="audio-time-total" class="audio-time-label">00:00</span>
                </div>
            </div>

            <div class="audio-bar-right">
                <button id="audio-loop-btn" class="audio-icon-btn sm" data-loop-state="off" data-i18n-tooltip="music.mode_loop_off"><i class="fas fa-redo"></i></button>
                <div class="audio-volume-group">
                    <button id="audio-mute-btn" class="audio-icon-btn sm"><i class="fas fa-volume-up"></i></button>
                    <input type="range" id="audio-volume-slider" class="audio-volume-slider" min="0" max="100" value="80">
                </div>
                <button id="audio-bar-open-window-btn" class="audio-studio-expand-btn">
                    <i class="fas fa-list-ul"></i> <span data-i18n="music.btn_playlists_library"></span> <i class="fas fa-chevron-up"></i>
                </button>
                <button id="audio-stop-btn" class="audio-icon-btn sm danger" data-i18n-tooltip="music.stop_close"><i class="fas fa-times"></i></button>
            </div>
        </div>
    </section>

    <!-- Quick Add-to-Playlist Picker Modal -->
    <div id="playlist-picker-modal" class="modal-overlay hidden unselectable">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h2 data-i18n="music.picker_title"></h2>
                <button id="playlist-picker-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="playlist-picker-target-info" class="playlist-picker-target-info"></p>
                <div id="playlist-picker-list" class="playlist-picker-list"></div>
                <div class="playlist-picker-create-row">
                    <input type="text" id="playlist-picker-new-name" class="modal-input" data-i18n-placeholder="music.new_playlist_placeholder" spellcheck="false" autocomplete="off">
                    <button id="playlist-picker-create-btn" class="btn" data-i18n="music.btn_create_and_add"></button>
                </div>
            </div>
            <div class="modal-footer">
                <button id="playlist-picker-cancel-btn" class="btn btn-secondary" data-i18n="dialog.btn_cancel"></button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/i18n.js?v=7"></script>
    <script type="text/javascript" src="js/components/tooltip_manager.js?v=1"></script>
    <script type="text/javascript" src="js/components/selection_manager.js?v=1"></script>
    <script type="text/javascript" src="js/core/state.js?v=7"></script>

<script type="text/javascript" src="js/modules/transfer/transfer_view.js?v=7"></script>
<script type="text/javascript" src="js/modules/transfer/transfer_controller.js?v=9"></script>
    <script type="text/javascript" src="js/core/ui_manager.js?v=7"></script>
    <script type="text/javascript" src="js/modules/settings/settings_handler.js?v=7"></script>
<script type="text/javascript" src="js/modules/file_system/file_tree_view.js?v=7"></script>
<script type="text/javascript" src="js/modules/file_system/file_tree_controller.js?v=7"></script>
<script type="text/javascript" src="js/modules/file_system/file_list_view.js?v=7"></script>
<script type="text/javascript" src="js/modules/file_system/file_list_controller.js?v=7"></script>
<script type="text/javascript" src="js/modules/file_system/action_view.js?v=7"></script>
<script type="text/javascript" src="js/modules/file_system/action_controller.js?v=7"></script>
<script type="text/javascript" src="js/modules/trash/trash_view.js?v=7"></script>
    <script type="text/javascript" src="js/modules/trash/trash_controller.js?v=7"></script>
    <script type="text/javascript" src="js/modules/gallery/gallery_handler.js?v=6"></script>
    <script type="text/javascript" src="js/modules/preview/text_handler.js?v=5"></script>
    <script type="text/javascript" src="js/modules/preview/document_handler.js?v=2"></script>
    <script type="text/javascript" src="js/modules/audio/audio_player_core.js?v=1"></script>
    <script type="text/javascript" src="js/modules/audio/audio_studio_view.js?v=1"></script>

    <script type="text/javascript" src="js/main.js?v=7"></script>
</body>
