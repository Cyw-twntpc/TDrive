<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="icon.ico">
    <title data-i18n="main.window_title"></title>
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css?v=6">
    <link rel="stylesheet" href="css/style.css?v=6">
    <script type="text/javascript" src="js/qwebchannel.js?v=6"></script>
    <script type="text/javascript">
        window.addEventListener('load', function() {
            if (typeof qt !== 'undefined') {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    window.tdrive_bridge = channel.objects.tdrive_bridge;
                    console.log("QWebChannel bridge initialized.");
                    document.dispatchEvent(new Event("TDriveBridgeReady"));
                });
            } else {
                console.warn("QWebChannel object 'qt' not found. Running in UI testing mode.");
                document.dispatchEvent(new Event("TDriveBridgeReady"));
            }
        });
    </script>
</head>
<body oncontextmenu="return false;">
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo unselectable">
                <img src="title.png" alt="TDrive Logo">
            </div>
            
            <div class="sidebar-body">
                <!-- Nav Rail -->
                <nav id="nav-rail" class="nav-rail">
                    <ul class="nav-items">
                        <li class="nav-item active" data-page="files">
                            <i class="fas fa-folder"></i>
                            <span class="nav-text" data-i18n="main.nav_files"></span>
                        </li>
                        <li class="nav-item" data-page="transfer">
                            <i class="fas fa-exchange-alt"></i>
                            <span class="nav-text" data-i18n="main.nav_transfer"></span>
                        </li>
                        <li class="nav-item disabled" data-page="shared" data-i18n-title="main.coming_soon">
                            <i class="fas fa-share-alt"></i>
                            <span class="nav-text" data-i18n="main.nav_shared"></span>
                        </li>
                        <li class="nav-item" data-page="trash">
                            <i class="fas fa-trash-alt"></i>
                            <span class="nav-text" data-i18n="main.nav_trash"></span>
                        </li>
                    </ul>
                </nav>

                <!-- Sidebar Content -->
                <div class="sidebar-content">
                    <div class="sidebar-actions">
                        <button id="sidebar-new-btn" class="btn-primary-block" data-popover="new-menu-popover">
                            <i class="fas fa-plus"></i> <span data-i18n="main.btn_new"></span>
                        </button>
                        <div id="new-menu-popover" class="popover hidden unselectable">
                            <ul style="list-style: none; padding: 0;">
                                <li id="new-upload-file-btn" class="popover-item">
                                    <i class="fas fa-file-upload"></i> <span data-i18n="main.new_upload_file"></span>
                                </li>
                                <li id="new-upload-folder-btn" class="popover-item">
                                    <i class="fas fa-folder-plus"></i> <span data-i18n="main.new_upload_folder"></span>
                                </li>
                                <li id="new-create-folder-btn" class="popover-item">
                                    <i class="fas fa-plus"></i> <span data-i18n="main.new_create_folder"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    
                    <nav class="file-tree-nav">
                        <ul id="file-tree"></ul>
                    </nav>
                    
                    <div id="sidebar-transfer-status" class="sidebar-transfer-status">
                        <div class="sidebar-transfer-left">
                             <div class="transfer-icon-wrapper"></div>
                        </div>
                        <div class="sidebar-transfer-right">
                            <div class="transfer-info-row">
                                <span id="sidebar-transfer-title"></span>
                            </div>
                            <div class="transfer-info-row">
                                <span id="sidebar-transfer-speed">-- B/s</span>
                            </div>
                            <div class="sidebar-progress-container">
                                <div id="sidebar-transfer-bar" class="sidebar-progress-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div id="global-progress-bar"><div class="runner"></div></div>
            
            <!-- Files Page -->
            <div id="page-files" class="page-view active">
                <header class="top-bar">
                    <div class="top-row">
                        <div class="search-container">
                            <div class="search-bar">
                                <i class="fas fa-search"></i>
                                <input type="text" data-i18n-placeholder="main.search_placeholder" spellcheck="false" autocomplete="off">
                            </div>
                            <button id="search-scope-toggle" class="search-scope-btn" data-i18n-title="main.search_scope_title"><span data-i18n="main.search_scope_all"></span></button>
                        </div>
                        <div class="user-actions">
                            <button id="view-toggle-btn" class="btn-icon" data-i18n-title="main.view_toggle_title"><i class="fas fa-th-large"></i></button>
                            <button id="help-btn" class="btn-icon" data-i18n-title="main.help_title" data-popover="help-popover"><i class="fas fa-question-circle"></i></button>
                            <button id="settings-btn" class="btn-icon" data-i18n-title="main.settings_title" data-popover="settings-popover"><i class="fas fa-cog"></i></button>
                            <button id="user-btn" class="btn-icon" data-i18n-title="main.user_info_title" data-popover="user-popover">
                                <i class="fas fa-user-circle"></i>
                            </button>
                        </div>
                    </div>
                    <div class="bottom-row">
                        <nav id="breadcrumb" class="breadcrumb-nav"></nav>
                    </div>
                </header>

                <section id="file-list-container" class="file-list-section">
                    <div class="data-list-header file-list-header">
                        <div class="col file-item-col name sortable" data-sort="name">
                            <div class="header-name-wrapper">
                                <span data-i18n="file_list.col_name"></span>
                                <span class="sort-icon"></span>
                            </div>
                        </div>
                        <div class="col file-item-col date sortable" data-sort="date">
                            <div class="header-name-wrapper">
                                <span data-i18n="file_list.col_date"></span>
                                <span class="sort-icon"></span>
                            </div>
                        </div>
                        <div class="col file-item-col type sortable" data-sort="type">
                            <div class="header-name-wrapper">
                                <span data-i18n="file_list.col_type"></span>
                                <span class="sort-icon"></span>
                            </div>
                        </div>
                        <div class="col file-item-col size sortable" data-sort="size">
                            <div class="header-name-wrapper">
                                <span data-i18n="file_list.col_size"></span>
                                <span class="sort-icon"></span>
                            </div>
                        </div>
                    </div>
                    <div id="file-list-body" class="file-list-body">
                    </div>
                    <div id="selection-box" class="selection-box"></div>
                </section>
                
                <!-- Floating Action Toolbar -->
                <div id="file-floating-toolbar" class="floating-toolbar">
                    <button class="toolbar-btn" id="ft-download-btn" data-i18n-title="menu.download"><i class="fas fa-download"></i></button>
                    <button class="toolbar-btn" id="ft-move-btn" data-i18n-title="menu.move"><i class="fas fa-arrow-right-to-bracket"></i></button>
                    <button class="toolbar-btn" id="ft-rename-btn" data-i18n-title="menu.rename"><i class="fas fa-pencil-alt"></i></button>
                    <div class="toolbar-separator"></div>
                    <button class="toolbar-btn" id="ft-share-btn" data-i18n-title="menu.share_soon"><i class="fas fa-share-alt"></i></button>
                    <button class="toolbar-btn" id="ft-details-btn" data-i18n-title="menu.details"><i class="fas fa-info-circle"></i></button>
                    <div class="toolbar-separator"></div>
                    <button class="toolbar-btn" id="ft-trash-btn" data-i18n-title="menu.move_to_trash"><i class="fas fa-trash"></i></button>
                </div>
            </div>

            <!-- Trash Page -->
            <div id="page-trash" class="page-view hidden">
                <header class="top-bar">
                    <div class="top-row">
                        <div class="trash-header-title">
                            <i class="fas fa-trash-alt"></i> <span data-i18n="main.nav_trash"></span> <span class="trash-tip" data-i18n="trash.tip"></span>
                        </div>
                    </div>
                    <div class="bottom-row">
                        <div id="trash-bulk-actions" class="action-buttons hidden">
                            <button id="trash-restore-btn" class="btn"><i class="fas fa-undo-alt"></i> <span data-i18n="trash.btn_restore"></span></button>
                            <button id="trash-delete-btn" class="btn btn-danger"><i class="fas fa-trash-alt"></i> <span data-i18n="trash.btn_delete"></span></button>
                        </div>
                        <div class="action-buttons">
                            <button id="empty-trash-btn" class="btn" data-i18n-title="trash.btn_empty">
                                <i class="fas fa-dumpster"></i> <span data-i18n="trash.btn_empty"></span>
                            </button>
                        </div>
                    </div>
                </header>
                <section class="file-list-section">
                    <div class="data-list-header trash-list-header trash-header">
                        <div class="sortable" data-sort="name">
                            <div class="header-name-wrapper"><span data-i18n="file_list.col_name"></span><span class="sort-icon"></span></div>
                        </div>
                        <div class="sortable desc" data-sort="trashed_date">
                            <div class="header-name-wrapper"><span data-i18n="trash.col_deleted_date"></span><span class="sort-icon"></span></div>
                        </div>
                        <div class="sortable" data-sort="type">
                            <div class="header-name-wrapper"><span data-i18n="file_list.col_type"></span><span class="sort-icon"></span></div>
                        </div>
                        <div class="sortable" data-sort="original_parent_id">
                            <div class="header-name-wrapper"><span data-i18n="trash.col_original_path"></span><span class="sort-icon"></span></div>
                        </div>
                        <div class="sortable" data-sort="size">
                            <div class="header-name-wrapper"><span data-i18n="file_list.col_size"></span><span class="sort-icon"></span></div>
                        </div>
                    </div>
                    <div id="trash-list-body" class="trash-list-body">
                        <!-- Trash items -->
                    </div>
                    <div id="trash-selection-box" class="selection-box"></div>
                </section>
            </div>

            <!-- Transfer Dashboard -->
            <div id="page-transfer" class="page-view hidden">
                <div class="transfer-dashboard-body">
                    
                    <!-- Hero Section -->
                    <div class="hero-section">

                        <div class="hero-content">
                            <div class="hero-stat-block">
                                <h2 id="hero-total-speed">-- B/s</h2>
                                <p data-i18n="transfer.total_speed"></p>
                            </div>
                            <div class="hero-stat-block">
                                <h2 id="hero-daily-traffic">--</h2>
                                <p data-i18n="transfer.daily_traffic"></p>
                            </div>
                            <div class="hero-stat-block">
                                <h2 id="hero-eta">--:--:--</h2>
                                <p data-i18n="transfer.eta"></p>
                            </div>
                        </div>
                        <div class="hero-actions">
                            <button id="global-pause-btn" class="icon-btn-lg" data-i18n-title="transfer.pause_all"><i class="fas fa-pause"></i></button>
                            <button id="global-cancel-btn" class="icon-btn-lg danger" data-i18n-title="transfer.cancel_all"><i class="fas fa-times"></i></button>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="tabs-container">
                        <div class="tab-item active" data-tab="uploads" data-i18n="transfer.tab_uploads"></div>
                        <div class="tab-item" data-tab="downloads" data-i18n="transfer.tab_downloads"></div>
                        <div class="tab-item" data-tab="completed" data-i18n="transfer.tab_completed"></div>
                    </div>

                    <!-- Dynamic Content -->
                    <div id="transfer-live-view">
                        <!-- Active Tasks -->
                        <div id="section-active" class="task-section">
                            <div class="task-group-title" style="color:var(--primary);">
                                <span data-i18n="transfer.section_active"></span> (<span id="count-active">0</span>) <div class="group-line"></div>
                            </div>
                            <div id="list-active" class="task-list-container"></div>
                        </div>

                        <!-- Failed Tasks -->
                        <div id="section-failed" class="task-section hidden">
                            <div class="task-group-title" style="color:var(--danger);">
                                <span data-i18n="transfer.section_failed"></span> (<span id="count-failed">0</span>) 
                                <div class="group-line"></div> 
                                <button id="retry-all-btn" class="retry-all-btn" data-i18n="transfer.btn_retry_all"></button>
                            </div>
                            <div id="list-failed" class="task-list-container"></div>
                        </div>

                        <!-- Queued Tasks -->
                        <div id="section-queued" class="task-section">
                            <div class="task-group-title">
                                <span data-i18n="transfer.section_queued"></span> (<span id="count-queued">0</span>) <div class="group-line"></div>
                            </div>
                            <div id="list-queued" class="task-list-container"></div>
                        </div>
                    </div>

                    <!-- Completed View -->
                    <div id="transfer-completed-view" class="hidden">
                        <div class="completed-filter-bar">
                            <div class="filters-group">
                                <div class="filter-segment active" data-filter="all" data-i18n="transfer.filter_all"></div>
                                <div class="filter-segment" data-filter="upload" data-i18n="transfer.filter_upload"></div>
                                <div class="filter-segment" data-filter="download" data-i18n="transfer.filter_download"></div>
                            </div>
                            <button id="btn-clear-completed" class="btn-text-danger"><i class="fas fa-trash-alt"></i> <span data-i18n="transfer.btn_clear_history"></span></button>
                        </div>
                        <div class="sort-bar">
                            <span class="sort-label" data-i18n="transfer.sort_by"></span>
                            <div class="sort-item active" data-sort="time"><span data-i18n="transfer.sort_time"></span> <i class="fas fa-sort-down"></i></div>
                            <div class="sort-item" data-sort="name" data-i18n="file_list.col_name"></div>
                        </div>
                        <div id="list-completed" class="history-list"></div>
                    </div>

                </div>
            </div>

        </main>
    </div>
    
    <div id="help-popover" class="popover hidden unselectable">
        <h3 data-i18n="dialog.help_title"></h3>
        <p data-i18n="dialog.help_intro"></p>
        <p><b data-i18n="dialog.help_tips"></b></p>
        <ul>
            <li data-i18n="dialog.help_tip_1"></li>
            <li data-i18n="dialog.help_tip_2"></li>
            <li data-i18n="dialog.help_tip_3"></li>
            <li data-i18n="dialog.help_tip_4"></li>
        </ul>
    </div>

    <div id="settings-popover" class="popover hidden unselectable">
        <h3 data-i18n="dialog.settings_title"></h3>
        <div class="setting-item">
            <label for="language-select" data-i18n="dialog.settings_language"></label>
            <select id="language-select">
                <option value="zh-TW">繁體中文</option>
                <option value="en-US">English</option>
            </select>
        </div>
        <div class="setting-item">
            <label for="theme-select" data-i18n="dialog.settings_theme"></label>
            <select id="theme-select">
                <option value="light" data-i18n="dialog.theme_light"></option>
                <option value="dark" disabled data-i18n="dialog.theme_dark_soon"></option>
            </select>
        </div>
        <div class="setting-item">
            <label data-i18n="dialog.settings_default_dl"></label>
            <div class="setting-control-group">
                <label class="switch">
                    <input type="checkbox" id="use-default-download-path-toggle">
                    <span class="slider round"></span>
                </label>
                <button id="set-default-download-path-btn" class="btn btn-secondary" style="font-size: 12px; padding: 4px 8px;" data-i18n="dialog.btn_select_path"></button>
            </div>
        </div>
        <div id="default-download-path-display" class="setting-path-display"><span data-i18n="dialog.path_not_set"></span></div>
        <button id="save-settings-btn" class="btn" style="margin-top: 20px; width: 100%;" data-i18n="dialog.btn_save_settings"></button>
        <button id="restore-settings-btn" class="btn btn-danger" style="margin-top: 10px; width: 100%;" data-i18n="dialog.btn_restore_settings">恢復預設值</button>
    </div>

    <div id="user-popover" class="popover hidden unselectable">
        <h3 data-i18n="dialog.user_info_title"></h3>
        <div id="user-info-content"></div>
        <button id="logout-btn" class="btn btn-danger" style="margin-top: 20px; width: 100%;" data-i18n="dialog.btn_logout"></button>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden unselectable">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h2 id="confirm-title" data-i18n="dialog.confirm_title"></h2>
                <button id="confirm-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="confirm-message" data-i18n="dialog.confirm_msg"></p>
            </div>
            <div class="modal-footer">
                <button id="confirm-cancel-btn" class="btn btn-secondary" data-i18n="dialog.btn_cancel"></button>
                <button id="confirm-ok-btn" class="btn btn-danger" data-i18n="dialog.btn_ok"></button>
            </div>
        </div>
    </div>

    <div id="move-modal" class="modal-overlay hidden unselectable">
        <div class="modal-content medium-modal">
            <div class="modal-header">
                <h2 data-i18n="dialog.move_title"></h2>
                <button id="move-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p data-i18n="dialog.move_msg"></p>
                <div id="move-tree-container" class="folder-tree-container">
                    <!-- Folder tree will be injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="move-cancel-btn" class="btn btn-secondary" data-i18n="dialog.btn_cancel"></button>
                <button id="move-confirm-btn" class="btn" data-i18n="dialog.btn_move_here"></button>
            </div>
        </div>
    </div>

    <div id="alert-modal" class="modal-overlay hidden unselectable">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h2 id="alert-title" data-i18n="dialog.alert_title"></h2>
                <button id="alert-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="alert-message"></p>
            </div>
            <div class="modal-footer">
                <button id="alert-ok-btn" class="btn" data-i18n="dialog.btn_ok"></button>
            </div>
        </div>
    </div>

    <div id="prompt-modal" class="modal-overlay hidden">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h2 id="prompt-title" data-i18n="dialog.prompt_title"></h2>
                <button id="prompt-close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p id="prompt-message" data-i18n="dialog.prompt_msg"></p>
                <input type="text" id="prompt-input" class="modal-input" spellcheck="false" autocomplete="off">
                <p id="prompt-error" class="modal-error hidden"></p>
            </div>
            <div class="modal-footer">
                <button id="prompt-cancel-btn" class="btn btn-secondary" data-i18n="dialog.btn_cancel"></button>
                <button id="prompt-ok-btn" class="btn" data-i18n="dialog.btn_ok"></button>
            </div>
        </div>
    </div>

    <template id="transfer-item-template">
        <div class="transfer-item" data-id="" data-parent-id="">
            <div class="item-indent"></div>
            <span class="item-toggle"></span>
            <i class="file-icon"></i>
            <div class="item-info">
                <span class="item-name"></span>
                <div class="item-details">
                    <span class="item-progress-text"></span>
                    <span class="item-speed"></span>
                </div>
                <div class="item-progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>
            <div class="item-status"></div>
            <div class="item-actions">
                <button class="action-btn pause-item" data-i18n-title="transfer.btn_pause"><i class="fas fa-pause"></i></button>
                <button class="action-btn resume-item" data-i18n-title="transfer.btn_resume"><i class="fas fa-play"></i></button>
                <button class="action-btn cancel-item" data-i18n-title="transfer.btn_cancel"><i class="fas fa-times"></i></button>
                <button class="action-btn retry-item" data-i18n-title="transfer.btn_retry"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>
    </template>
    
    <div id="gallery-modal" class="gallery-overlay hidden">
        <div class="gallery-header">
            <span id="gallery-filename"></span>
            <button id="gallery-close-btn" class="icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="gallery-content">
            <button id="gallery-prev-btn" class="nav-btn left"><i class="fas fa-chevron-left"></i></button>
            <div class="gallery-image-wrapper">
                <img id="gallery-image" src="" alt="Preview">
                <div id="gallery-spinner" class="spinner hidden"></div>
            </div>
            <button id="gallery-next-btn" class="nav-btn right"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div id="gallery-filmstrip" class="gallery-filmstrip">
            <!-- Thumbnails injected by JS -->
        </div>
    </div>

    <div id="blocking-overlay" class="modal-overlay hidden" style="z-index: 9998; background-color: rgba(90, 90, 90, 0.2);">
        <!-- This is a generic, content-less overlay to block UI interactions -->
    </div>

    <div id="connection-lost-overlay" class="modal-overlay hidden" style="z-index: 10000; background-color: rgba(0, 0, 0, 0.6);">
        <div class="loading-content" style="color: white; text-align: center;">
            <i class="fas fa-wifi-slash" style="font-size: 48px; margin-bottom: 20px;"></i>
            <p style="font-size: 20px; font-weight: 500;"><span data-i18n="main.conn_lost"></span></p>
            <p style="font-size: 16px; color: #ccc; margin-top: 8px;"><span data-i18n="main.conn_reconnecting"></span></p>
        </div>
    </div>

    <div id="interaction-lock-overlay"></div>
    <script type="text/javascript" src="js/i18n.js?v=7"></script>
    <script type="text/javascript" src="js/core/state.js?v=7"></script>
    <script type="text/javascript" src="js/core/api_service.js?v=7"></script>
    <script type="text/javascript" src="js/components/ui_modals.js?v=7"></script>
    <script type="text/javascript" src="js/modules/transfer/transfer_model.js?v=7"></script>
<script type="text/javascript" src="js/modules/transfer/transfer_view.js?v=7"></script>
<script type="text/javascript" src="js/modules/transfer/transfer_controller.js?v=9"></script>
    <script type="text/javascript" src="js/core/ui_manager.js?v=7"></script>
    <script type="text/javascript" src="js/modules/settings/settings_handler.js?v=7"></script>
    <script type="text/javascript" src="js/modules/file_system/file_tree_model.js?v=7"></script>
<script type="text/javascript" src="js/modules/file_system/file_tree_view.js?v=7"></script>
<script type="text/javascript" src="js/modules/file_system/file_tree_controller.js?v=7"></script>
    <script type="text/javascript" src="js/modules/file_system/file_list_model.js?v=7"></script>
